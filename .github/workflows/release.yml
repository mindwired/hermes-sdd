name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate tag and build deterministic archives
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv sync --locked
          uv run python -m unittest discover -s tests -v
          uv run python scripts/build_release.py --version "$version"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hermes-sdd-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
