name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Synchronize locked environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Unit and integration tests
        run: uv run python -m unittest discover -s tests -v
      - name: Repository contract verification
        run: uv run python scripts/verify.py --require-node

  dashboard-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Exercise FastAPI adapter against Hermes-compatible dependencies
        run: >-
          uv run --isolated --with fastapi==0.128.2 --with httpx==0.28.1
          --with pydantic==2.12.5 --with pydantic-core==2.41.5
          env HERMES_REQUIRE_DASHBOARD_TESTS=1 python -m unittest tests.integration.test_dashboard_api -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Ruff lint
        run: uvx --from ruff==0.16.1 ruff check .
      - name: Ruff format check
        run: uvx --from ruff==0.16.1 ruff format --check .
